# Regenerate the Xcode project with `xcodegen generate` (run from this directory).
name: LGLanScannerExample
options:
  bundleIdPrefix: com.LG
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # The library, from the repository root — the example always builds against the working tree.
  LGLanScanner:
    path: ..

targets:
  LGLanScannerExample:
    type: application
    platform: iOS
    sources:
      - path: LGLanScannerExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.LG.LGLanScannerExample
        DEVELOPMENT_TEAM: UBS5NLP4XW
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Scanning the LAN triggers iOS's local-network permission prompt.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Scans your local network to list the devices on it."
    dependencies:
      - package: LGLanScanner

schemes:
  LGLanScannerExample:
    build:
      targets:
        LGLanScannerExample: all
    run:
      config: Debug
