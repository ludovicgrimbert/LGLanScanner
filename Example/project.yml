# Regenerate the Xcode project with `xcodegen generate` (run from this directory).
name: LGLanScannerExample
options:
  bundleIdPrefix: com.LG
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # The library, from the repository root — the example always builds against the working tree.
  LGLanScanner:
    path: ..

targets:
  LGLanScannerExample:
    type: application
    platform: iOS
    sources:
      - path: LGLanScannerExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.LG.LGLanScannerExample
        DEVELOPMENT_TEAM: UBS5NLP4XW
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: LGLanScannerExample/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Scanning the LAN triggers iOS's local-network permission prompt.
        NSLocalNetworkUsageDescription: "Scans your local network to list the devices on it."
        # Every Bonjour type the discovery browses must be declared (iOS 14+).
        NSBonjourServices:
          - _googlecast._tcp
          - _androidtvremote2._tcp
          - _airplay._tcp
          - _http._tcp
          - _hap._tcp
          - _printer._tcp
          - _ipp._tcp
          - _smb._tcp
    dependencies:
      - package: LGLanScanner
        product: LGLanScanner
      - package: LGLanScanner
        product: LGLanDiscovery

schemes:
  LGLanScannerExample:
    build:
      targets:
        LGLanScannerExample: all
    run:
      config: Debug
